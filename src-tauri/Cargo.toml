[package]
name = "BlurAutoClicker"
version = "3.9.6"
description = "BlurAutoClicker - accuracy and performance focused auto clicker for Windows."
authors = ["Blur009"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
sha2 = "0.11"
hex = "0.4"

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon", "image-ico"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading", "Win32_Security", "Win32_Security_WinTrust", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_UI_Shell"] }
webview2-com = "0.39"
windows-core = "0.61"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tauri-plugin-opener = "2.0"
tauri-plugin-log = "2.9.0"
tauri-plugin-fs = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-store = "2.4.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
log = "0.4.33"
serde_json = "1.0.151"
raw-window-handle = "0.6.2"
tauri-plugin-updater = "2.10.0"
hmac = "0.13.0"
sha2 = "0.11"
hex = "0.4"
dirs = "6.0.0"
windows-targets = "0.53.5"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
base64 = "0.23.1"
chrono = "0.4"
# prebuilt with hash pin in build.rs + verify in crash_handler.rs for supply-chain safety
# vendored would require depot_tools + python and breaks `cargo check` without it
crashpad-rs = { version = "0.2", features = ["prebuilt"], optional = true }
walkdir = "2"
zip = "8.6.0"
open = "5.4.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
default = ["crashpad"]
crashpad = ["crashpad-rs"]

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
incremental = false
panic = "unwind"
