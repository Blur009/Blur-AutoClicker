name: Dependabot auto-merge

# Turns on GitHub's auto-merge for every Dependabot PR. Auto-merge then waits
# for the checks required by the "Protect Dev" ruleset and merges the PR as
# soon as they pass, so no manual step is involved.
#
# This is only safe while the target branch requires CI checks. Without them
# GitHub has nothing to wait for and merges the PR immediately, which is how
# three unverified PRs landed on dev on 2026-10-20. The guard below refuses to
# run when auto-merge is off, and the ruleset is what makes the wait real.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          enabled=$(gh api "repos/${{ github.repository }}" --jq .allow_auto_merge)
          if [ "$enabled" != "true" ]; then
            echo "auto-merge is disabled for this repository, doing nothing"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
