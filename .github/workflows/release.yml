name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Build and release
    # Point RELEASE_RUNNER (repository variable) at the local runner to build
    # here, e.g. ["self-hosted","Windows","X64","blur-release"]. Clear the
    # variable and the release goes back to the hosted runner.
    runs-on: ${{ vars.RELEASE_RUNNER && fromJSON(vars.RELEASE_RUNNER) || 'windows-latest' }}
    timeout-minutes: 30
    # Hand the tag over as data. Interpolating ${{ github.ref_name }} straight
    # into a run: block makes GitHub substitute it before the shell parses the
    # script, so a tag carrying shell metacharacters would become code.
    env:
      TAG_NAME: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A persistent local runner keeps src-tauri/target and node_modules,
          # which is the whole point. Hosted runners start empty, so only they
          # need the clean. Checkout still resets tracked files either way.
          clean: ${{ vars.RELEASE_RUNNER == '' }}

      # A tag pushed from a stale local branch builds a tree that CI never saw.
      - name: Refuse a tag that is not on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG_NAME points at $GITHUB_SHA, which is not on main. Merge the work first, then re-tag."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Audit Rust dependencies
        shell: bash
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $tagVersion = $env:TAG_NAME.TrimStart('v')
          $version = [regex]::Escape($tagVersion)
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^# v$version .*?(?=\n# v|\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $env:TAG_NAME" }

          $lines = $match.Value.Trim() -split "`n"
          # "# v3.10.3 - 06.11.2026 (d.m.y)" -> "3.10.3 - 06.11.26"
          $heading = $lines[0] -split ' - ', 2
          if ($heading.Count -ne 2) { throw "Unusable changelog heading: $($lines[0])" }
          $dateBits = (($heading[1].Trim() -split ' ')[0]).Split('.')
          if ($dateBits.Count -ne 3) { throw "Unusable changelog date: $($heading[1])" }
          $name = "$tagVersion - $($dateBits[0]).$($dateBits[1]).$($dateBits[2].Substring(2))"
          Write-Output "name=$name" >> $env:GITHUB_OUTPUT

          # The release body is the sections only, no version heading.
          $body = ((($lines | Select-Object -Skip 1) -join "`n").Trim())
          if (-not $body) { throw "CHANGELOG.md section for $env:TAG_NAME has no body" }
          Set-Content -Path release_body.md -Value $body
          Write-Host "release name: $name"

      - name: Regenerate the crashpad handler
        shell: pwsh
        run: cargo clean --manifest-path src-tauri/Cargo.toml --package crashpad-rs-sys --release

      - name: Build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.changelog.outputs.name }}
          releaseBody: Building, the real notes land in the next step.
          releaseDraft: false

      - name: Update release name and body from changelog
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path release_body.md)) { throw 'release_body.md is missing, the changelog step did not run' }
          gh release edit "$env:TAG_NAME" `
            --title "${{ steps.changelog.outputs.name }}" `
            --notes-file release_body.md

      - name: Create portable package
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/package-portable.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Tag "$env:TAG_NAME"

      - name: Upload portable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:TAG_NAME" `
            "BlurAutoClicker-$env:TAG_NAME-portable.zip" `
            --clobber

  winget:
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: release
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    env:
      TAG_NAME: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          Write-Output "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Find NSIS installer URL
        id: asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh api "repos/$env:REPO/releases/tags/$env:TAG_NAME" | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like '*_x64-setup.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer asset found' }
          Write-Output "url=$($installer.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Download wingetcreate
        run: curl.exe -JLO https://aka.ms/wingetcreate/latest

      - name: Verify wingetcreate
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\wingetcreate.exe -Algorithm SHA256).Hash
          Write-Host "wingetcreate hash: $hash"
          if (-not $hash) { throw "wingetcreate hash empty — download failed" }
          # Authenticode pin: wingetcreate must be Microsoft-signed
          try {
            $sig = Get-AuthenticodeSignature -FilePath .\wingetcreate.exe
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
              throw "wingetcreate signature invalid: $($sig.Status) / $($sig.SignerCertificate.Subject)"
            }
            Write-Host "wingetcreate signature valid: $($sig.SignerCertificate.Subject)"
          } catch {
            throw "Failed to verify wingetcreate signature: $_"
          }
          # Optional hash pin if .github/wingetcreate.sha256 is committed
          if (Test-Path .github/wingetcreate.sha256) {
            $expected = (Get-Content .github/wingetcreate.sha256 -Raw).Trim().ToLower()
            # strip comments / whitespace, take first 64 hex
            $expected = ($expected -split '\s' | Where-Object { $_ -match '^[a-f0-9]{64}$' } | Select-Object -First 1)
            if ($expected -and $hash.ToLower() -ne $expected) {
              throw "wingetcreate hash mismatch: expected $expected, got $hash — update .github/wingetcreate.sha256 if legitimate upstream update"
            }
          }

      - name: Generate manifest locally
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_URL: ${{ steps.asset.outputs.url }}
        run: |
          $attempts = 4
          for ($i = 1; $i -le $attempts; $i++) {
            .\wingetcreate.exe update Blur009.BlurAutoClicker `
              --version $env:VERSION `
              --urls "$env:ASSET_URL|x64" `
              --out ./winget-manifests
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq $attempts) { break }
            $wait = [int]([math]::Pow(2, $i) * 15)
            Write-Warning "wingetcreate exited $LASTEXITCODE, retry $i/$($attempts - 1) in $wait seconds"
            Start-Sleep -Seconds $wait
            if (Test-Path ./winget-manifests) { Remove-Item ./winget-manifests -Recurse -Force }
          }
          throw "wingetcreate update failed after $attempts attempts"

      - name: Submit to winget-pkgs
        shell: pwsh
        run: |
          $manifestFile = Get-ChildItem ./winget-manifests -Recurse -Filter "*.yaml" | Select-Object -First 1
          if (-not $manifestFile) { throw 'No manifest yaml found under ./winget-manifests' }
          $manifestDir = $manifestFile.DirectoryName
          .\wingetcreate.exe submit --no-open $manifestDir

      - name: Open issue on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run = "${{ github.server_url }}/$env:REPO/actions/runs/${{ github.run_id }}"
          $body = "The winget-pkgs PR submission failed on release **$env:TAG_NAME**." +
            "`n`nCheck the [workflow run]($run) for logs."
          gh issue create --title "WinGet submission failed for $env:TAG_NAME" --body $body
