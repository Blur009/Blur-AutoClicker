name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Extract changelog
        shell: pwsh
        run: |
          $version = [regex]::Escape(("${{ github.ref_name }}".TrimStart('v')))
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)# v$version .*?(?=\n# v|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            Set-Content -Path release_body.md -Value $match.Value.Trim()
          }

      - name: Build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: false

      - name: Update release body from changelog
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path release_body.md) {
            gh release edit "${{ github.ref_name }}" --notes-file release_body.md
          }

      - name: Create portable package
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/package-portable.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Tag "${{ github.ref_name }}"

      - name: Upload portable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "BlurAutoClicker-${{ github.ref_name }}-portable.zip" `
            --clobber

  winget:
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: release
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Derive version (strip leading v from tag)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Output "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Find NSIS installer asset
        id: asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -like '*_x64-setup.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer asset found' }
          Write-Output "url=$($installer.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Download wingetcreate
        run: curl.exe -JLO https://aka.ms/wingetcreate/latest

      - name: Generate manifest locally
        shell: pwsh
        run: |
          .\wingetcreate.exe update Blur009.BlurAutoClicker `
            --version "${{ steps.version.outputs.version }}" `
            --urls "${{ steps.asset.outputs.url }}" `
            --out ./winget-manifests

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)# v$version .*?(?=\n# v|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            Set-Content -Path release_notes.md -Value $match.Value.Trim()
          } else {
            Set-Content -Path release_notes.md -Value "See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }

      - name: Inject ReleaseNotes
        shell: pwsh
        run: |
          $notes = Get-Content release_notes.md -Raw
          $locale = Get-ChildItem ./winget-manifests -Recurse -Filter "*.locale.*.yaml" | Select-Object -First 1
          if (-not $locale) { throw 'No locale manifest found to add ReleaseNotes' }
          $body = ($notes.TrimEnd() -split "`n") |
            Where-Object { $_ -notmatch '^#\s*v\d' } |
            ForEach-Object { "  " + ($_ -replace "`t", "    ").TrimEnd() }
          $block = "ReleaseNotes: |`n" + ($body -join "`n") + "`n"
          Add-Content -Path $locale.FullName -Value $block

      - name: Submit PR to winget-pkgs
        shell: pwsh
        run: |
          .\wingetcreate.exe submit --no-open `
            ./winget-manifests

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create `
            --title "WinGet submission failed for ${{ github.ref_name }}" `
            --body "The winget-pkgs PR submission failed on release **${{ github.ref_name }}**.

          Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for logs.

          Common causes:
          - \`WINGET_CREATE_GITHUB_TOKEN\` secret is missing or expired.
          - The \`*_x64-setup.exe\` asset was not found on the release.
          - winget-pkgs rejected the manifest (see the PR if one was opened)."
